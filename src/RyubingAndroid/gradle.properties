# Ryubing Android build configuration.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- LibRyubing (dotnet publish) knobs ---
# Path to the .NET SDK 'dotnet' executable. Defaults to whatever is on PATH.
ryubing.dotnet.bin=dotnet
# Publish configuration for libryubing.so (Release or Debug).
ryubing.dotnet.config=Release
# Directory containing the Android NDK LLVM toolchain 'bin' (clang for aarch64).
# Required by `dotnet publish -r linux-bionic-arm64`. Example:
#   ryubing.ndk.toolchain=/opt/android-ndk-r27/toolchains/llvm/prebuilt/linux-x86_64/bin
ryubing.ndk.toolchain=
