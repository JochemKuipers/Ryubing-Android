# Ryubing Android build configuration.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- LibRyubing (dotnet publish) knobs ---
# Path to the .NET SDK 'dotnet' executable. Defaults to whatever is on PATH.
ryubing.dotnet.bin=dotnet
# Publish configuration for libryubing.so (Release or Debug).
ryubing.dotnet.config=Release
# Directory containing the Android NDK LLVM toolchain 'bin' (clang for aarch64), needed by
# `dotnet publish -r linux-bionic-arm64`. Leave this unset: the :libryubing build auto-detects
# it for the current OS from the Android SDK (local.properties sdk.dir / ANDROID_HOME /
# ANDROID_SDK_ROOT), so the same checkout works on Windows and WSL/Linux. Only set it to
# override auto-detection with a specific toolchain, e.g.:
#   ryubing.ndk.toolchain=/opt/android-sdk/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin