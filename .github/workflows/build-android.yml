name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: upstream/ryubing/global.json

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r27
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Resolve NDK toolchain path
        id: ndk
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          echo "toolchain=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_OUTPUT"

      - name: Configure Git identity for patch queue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply upstream patch queue
        run: scripts/apply-patches.sh

      - name: Verify LibRyubing compiles against upstream (host RID)
        run: dotnet build src/LibRyubing/LibRyubing.csproj -c Release

      - name: Build native dependencies (arm64)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: native-deps/build-all.sh

      - name: Gradle wrapper
        working-directory: src/RyubingAndroid
        run: gradle wrapper --gradle-version 8.11.1

      - name: Assemble debug APK
        working-directory: src/RyubingAndroid
        run: ./gradlew assembleDebug -Pryubing.ndk.toolchain=${{ steps.ndk.outputs.toolchain }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ryubing-debug-apk
          path: src/RyubingAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
